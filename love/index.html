<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>I Love You ❤️</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", sans-serif;
  }

  /* Floating hearts background */
  .hearts {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: 0;
  }

  .heart {
    position: absolute;
    bottom: -10%;
    color: rgba(255, 45, 85, 0.25);
    font-size: 24px;
    animation: floatUp linear infinite;
  }

  @keyframes floatUp {
    from {
      transform: translateY(0) scale(1);
      opacity: 0;
    }
    10% { opacity: 1; }
    to {
      transform: translateY(-120vh) scale(1.4);
      opacity: 0;
    }
  }

  .card {
    position: relative;
    z-index: 2;
    border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    background: rgba(255,255,255,0.92);
  }

  canvas {
    cursor: pointer;
  }
</style>
</head>
<body>

<!-- BACKGROUND HEARTS -->
<div class="hearts" id="hearts"></div>

<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card p-4 text-center">
        <h3 class="mb-2 text-danger">I LOVE YOU ❤️</h3>
        <canvas id="c" width="520" height="500"></canvas>
      </div>
    </div>
  </div>
</div>

<script>
// ---------- FLOATING HEARTS ----------
const heartsContainer = document.getElementById("hearts");

function spawnHeart() {
  const h = document.createElement("div");
  h.className = "heart";
  h.textContent = "❤";
  h.style.left = Math.random() * 100 + "vw";
  h.style.fontSize = 16 + Math.random() * 24 + "px";
  h.style.animationDuration = 6 + Math.random() * 6 + "s";
  heartsContainer.appendChild(h);

  setTimeout(() => h.remove(), 12000);
}

setInterval(spawnHeart, 400);

// ---------- CANVAS HEART ----------
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

const img = new Image();
img.src = "./good.jpg"; // replace with your photo

let t = 0;
let pulse = 0;
let beatTime = 0;
let state = 0; // 0 = gradient, 1 = photo, 2 = photo + text

function heart(t) {
  return {
    x: 16 * Math.pow(Math.sin(t), 3),
    y:
      13 * Math.cos(t)
      - 5 * Math.cos(2 * t)
      - 2 * Math.cos(3 * t)
      - Math.cos(4 * t)
  };
}

function buildHeartPath(scale, cx, cy) {
  ctx.beginPath();
  for (let i = 0; i <= Math.PI * 2; i += 0.01) {
    const p = heart(i);
    const x = cx + p.x * scale;
    const y = cy - p.y * scale;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  beatTime += 0.08;
  const beat =
    1 +
    0.04 * Math.sin(beatTime) +
    0.015 * Math.sin(2 * beatTime);

  const scale = 12 * beat;
  const cx = canvas.width / 2;
  const cy = canvas.height / 2 + 30;

  ctx.save();
  buildHeartPath(scale, cx, cy);
  ctx.clip();

  if (state === 0) {
    pulse += 0.02;
    const g = ctx.createRadialGradient(
      cx, cy, 40,
      cx, cy, 230 + Math.sin(pulse) * 18
    );
    g.addColorStop(0, "#ff5f6d");
    g.addColorStop(1, "#ffc371");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  } else {
    ctx.drawImage(img, cx - 170, cy - 260, 350, 575);
    if (state === 2) {
      ctx.fillStyle = "white";
      ctx.font = "24px serif";
      ctx.textAlign = "center";
      ctx.fillText("I love you ❤️", cx, cy + 10);
    }
  }

  ctx.restore();

  ctx.strokeStyle = "#ff2d55";
  ctx.lineWidth = 3 + 2 * Math.max(0, Math.sin(beatTime));
  ctx.shadowColor = "#ff2d55";
  ctx.shadowBlur = 8 + 6 * Math.max(0, Math.sin(beatTime));

  ctx.beginPath();
  for (let i = 0; i <= t; i += 0.01) {
    const p = heart(i);
    const x = cx + p.x * scale;
    const y = cy - p.y * scale;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.stroke();

  t += 0.03;
  if (t > Math.PI * 2) t = Math.PI * 2;

  requestAnimationFrame(draw);
}

canvas.addEventListener("click", () => {
  state = (state + 1) % 3;
});

draw();
</script>

</body>
</html>
